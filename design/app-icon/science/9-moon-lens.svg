<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Moon Lens: a magnifying glass studying the moon; the lens shows it bigger. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2F95"/>
      <stop offset="1" stop-color="#8F6BE8"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="440" cy="440" r="250"/></clipPath>
    <mask id="crescent">
      <circle cx="420" cy="470" r="175" fill="#fff"/>
      <circle cx="500" cy="400" r="150" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Handle -->
  <line x1="630" y1="630" x2="830" y2="830" stroke="#FFFFFF" stroke-width="80" stroke-linecap="round"/>
  <!-- Lens with a darker, magnified night inside -->
  <circle cx="440" cy="440" r="250" fill="#1E1860"/>
  <g clip-path="url(#lens)">
    <rect x="200" y="250" width="420" height="420" fill="url(#moon)" mask="url(#crescent)"/>
    <circle cx="560" cy="330" r="12" fill="#FFFFFF"/>
    <circle cx="600" cy="520" r="8" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="360" cy="300" rx="120" ry="50" fill="#FFFFFF" opacity="0.12" transform="rotate(-35 360 300)"/>
  </g>
  <circle cx="440" cy="440" r="250" fill="none" stroke="#FFFFFF" stroke-width="36"/>
</svg>
