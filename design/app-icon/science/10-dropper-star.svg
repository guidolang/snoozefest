<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Moon Dropper: a pipette drips a star onto a crescent moon, like adding one ingredient at a time. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2178"/>
      <stop offset="1" stop-color="#7A45C9"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="470" cy="640" r="250" fill="#fff"/>
      <circle cx="590" cy="545" r="215" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="160" y="330" width="620" height="620" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- Pipette -->
  <g transform="translate(690 90) rotate(25)">
    <rect x="-48" y="0" width="96" height="120" rx="40" fill="#FF8FA3"/>
    <rect x="-34" y="110" width="68" height="200" rx="10" fill="#FFFFFF"/>
    <path d="M-34 300 H34 L10 380 H-10 Z" fill="#FFFFFF"/>
  </g>
  <!-- Falling star drop -->
  <path d="M0 -60 Q0 0 60 0 Q0 0 0 60 Q0 0 -60 0 Q0 0 0 -60 Z" fill="#FFFFFF" transform="translate(605 480)"/>
</svg>
