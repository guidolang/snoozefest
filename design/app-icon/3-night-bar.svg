<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Night Bar: the app's per-night bar (first stretch + sleep after waking) under a moon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#B84FD8"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="420" cy="400" r="200" fill="#fff"/>
      <circle cx="505" cy="330" r="170" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="200" y="200" width="460" height="420" fill="#FFE08A" mask="url(#crescent)"/>
  <!-- First stretch -->
  <rect x="190" y="690" width="430" height="110" rx="55" fill="#FFFFFF"/>
  <!-- After waking -->
  <rect x="650" y="690" width="184" height="110" rx="55" fill="#FFFFFF" opacity="0.5"/>
  <!-- Stars -->
  <path d="M760 250 Q760 320 830 320 Q760 320 760 390 Q760 320 690 320 Q760 320 760 250 Z" fill="#FFFFFF"/>
  <path d="M680 470 Q680 500 710 500 Q680 500 680 530 Q680 500 650 500 Q680 500 680 470 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
