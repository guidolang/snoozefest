<!doctype html>
<html><head><meta charset="utf-8"><title>SnoozeFest icon options</title>
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; margin: 24px; background: #f2f2f7; color: #111; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .big { width: 200px; height: 200px; border-radius: 22.4%; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .small { display: flex; gap: 10px; padding: 10px; border-radius: 12px; }
  .small img { width: 60px; height: 60px; border-radius: 22.4%; }
  .light { background: #dfe3ea; } .dark { background: #111; }
  b { font-size: 15px; }
</style></head><body>
<div class="row">
  <div class="opt"><img class="big" src="0-current.png"><b>0 · Current</b>
    <div class="small light"><img src="0-current.png"></div><div class="small dark"><img src="0-current.png"></div></div>
  <div class="opt"><img class="big" src="1-bar-moon.svg"><b>1 · Bar Moon</b>
    <div class="small light"><img src="1-bar-moon.svg"></div><div class="small dark"><img src="1-bar-moon.svg"></div></div>
  <div class="opt"><img class="big" src="2-before-after.svg"><b>2 · Before / After</b>
    <div class="small light"><img src="2-before-after.svg"></div><div class="small dark"><img src="2-before-after.svg"></div></div>
  <div class="opt"><img class="big" src="3-night-bar.svg"><b>3 · Night Bar</b>
    <div class="small light"><img src="3-night-bar.svg"></div><div class="small dark"><img src="3-night-bar.svg"></div></div>
  <div class="opt"><img class="big" src="4-z-trend.svg"><b>4 · Z Trend</b>
    <div class="small light"><img src="4-z-trend.svg"></div><div class="small dark"><img src="4-z-trend.svg"></div></div>
  <div class="opt"><img class="big" src="5-sleepy-moon.svg"><b>5 · Sleepy Moon</b>
    <div class="small light"><img src="5-sleepy-moon.svg"></div><div class="small dark"><img src="5-sleepy-moon.svg"></div></div>
</div>
</body></html>
