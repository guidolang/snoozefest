<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Moon Journal: a notebook with a crescent moon on the cover and a bookmark ribbon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F95"/>
      <stop offset="1" stop-color="#8F6BE8"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241B63"/>
      <stop offset="1" stop-color="#1A144A"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="540" cy="470" r="150" fill="#fff"/>
      <circle cx="605" cy="410" r="128" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Page edges -->
  <rect x="300" y="190" width="460" height="660" rx="40" fill="#F4F0FF"/>
  <!-- Cover -->
  <rect x="264" y="170" width="470" height="670" rx="44" fill="url(#cover)"/>
  <rect x="264" y="170" width="70" height="670" rx="30" fill="#FFFFFF" opacity="0.08"/>
  <rect x="380" y="320" width="320" height="320" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M640 290 Q640 320 670 320 Q640 320 640 350 Q640 320 610 320 Q640 320 640 290 Z" fill="#FFFFFF"/>
  <!-- Label lines -->
  <rect x="400" y="700" width="220" height="18" rx="9" fill="#FFFFFF" opacity="0.35"/>
  <rect x="440" y="740" width="140" height="18" rx="9" fill="#FFFFFF" opacity="0.25"/>
  <!-- Bookmark ribbon -->
  <path d="M640 800 V900 L670 872 L700 900 V800 Z" fill="#FF8FA3"/>
</svg>
