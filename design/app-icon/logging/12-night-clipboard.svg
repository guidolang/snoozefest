<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Night Clipboard: a clipboard log, one row per night, each with a moon and a sleep bar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2178"/>
      <stop offset="1" stop-color="#7A45C9"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <mask id="c">
      <circle cx="0" cy="0" r="38" fill="#fff"/>
      <circle cx="18" cy="-15" r="32" fill="#000"/>
    </mask>
    <rect id="m" x="-45" y="-45" width="90" height="90" fill="url(#moon)" mask="url(#c)"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="222" y="170" width="580" height="720" rx="56" fill="#FFFFFF"/>
  <!-- Clip -->
  <rect x="392" y="130" width="240" height="96" rx="32" fill="#1E1860"/>
  <rect x="452" y="150" width="120" height="30" rx="15" fill="#FFFFFF" opacity="0.25"/>
  <!-- Rows -->
  <g>
    <use href="#m" transform="translate(320 340)"/>
    <rect x="390" y="322" width="330" height="36" rx="18" fill="#5E5CE6"/>
    <use href="#m" transform="translate(320 490)"/>
    <rect x="390" y="472" width="250" height="36" rx="18" fill="#5E5CE6"/>
    <rect x="652" y="472" width="68" height="36" rx="18" fill="#5E5CE6" opacity="0.4"/>
    <use href="#m" transform="translate(320 640)"/>
    <rect x="390" y="622" width="300" height="36" rx="18" fill="#5E5CE6"/>
    <use href="#m" transform="translate(320 790)" opacity="0.35"/>
    <rect x="390" y="772" width="330" height="36" rx="18" fill="#FF9F0A" opacity="0.35"/>
  </g>
</svg>
