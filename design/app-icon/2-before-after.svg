<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Before / After: an intervention marker splits a dim moon from a bright one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15133A"/>
      <stop offset="1" stop-color="#3B2F86"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Before: dim half -->
  <circle cx="512" cy="540" r="300" fill="#8E86C9" opacity="0.45" clip-path="url(#left)"/>
  <!-- After: bright half -->
  <circle cx="512" cy="540" r="300" fill="#FFD66E" clip-path="url(#right)"/>
  <!-- Intervention marker -->
  <rect x="498" y="170" width="28" height="700" rx="14" fill="#FF453A"/>
  <path d="M526 170 L700 222 L526 274 Z" fill="#FF453A"/>
</svg>
