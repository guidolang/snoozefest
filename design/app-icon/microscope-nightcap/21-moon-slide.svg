<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Eyepiece View: looking down a microscope eyepiece at a crescent moon, with focus marks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B63"/>
      <stop offset="1" stop-color="#6B3FB8"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="480" cy="540" r="200" fill="#fff"/>
      <circle cx="575" cy="460" r="172" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="360" fill="#16113F"/>
  <rect x="260" y="320" width="440" height="440" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- Crosshair ticks -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.8">
    <line x1="512" y1="180" x2="512" y2="240"/>
    <line x1="512" y1="784" x2="512" y2="844"/>
    <line x1="180" y1="512" x2="240" y2="512"/>
    <line x1="784" y1="512" x2="844" y2="512"/>
  </g>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <path d="M680 330 Q680 370 720 370 Q680 370 680 410 Q680 370 640 370 Q680 370 680 330 Z" fill="#FFFFFF"/>
</svg>
