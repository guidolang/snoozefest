<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nightcap Moon: the crescent moon wearing a floppy nightcap with a pom-pom. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F95"/>
      <stop offset="1" stop-color="#8F6BE8"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="1" stop-color="#FFCB5C"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="470" cy="580" r="290" fill="#fff"/>
      <circle cx="620" cy="470" r="250" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="160" y="270" width="620" height="620" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- Nightcap sits on the upper horn of the crescent -->
  <g transform="translate(420 300) rotate(-18)">
    <path d="M-120 40 Q-70 -200 170 -170 Q220 -120 250 -10 Q150 -120 60 -60 Q80 -10 110 40 Z" fill="#7FCBFF"/>
    <path d="M-60 -70 Q40 -110 140 -100" fill="none" stroke="#FFFFFF" stroke-width="18" opacity="0.5" stroke-linecap="round"/>
    <rect x="-140" y="20" width="270" height="64" rx="32" fill="#FFFFFF"/>
    <circle cx="258" cy="0" r="42" fill="#FFC94D"/>
  </g>
  <path d="M800 560 Q800 610 850 610 Q800 610 800 660 Q800 610 750 610 Q800 610 800 560 Z" fill="#FFFFFF"/>
</svg>
